apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: boutique/db
        property: username
    - secretKey: password
      remoteRef:
        key: boutique/db
        property: password
    - secretKey: host
      remoteRef:
        key: boutique/db
        property: host
    - secretKey: port
      remoteRef:
        key: boutique/db
        property: port
